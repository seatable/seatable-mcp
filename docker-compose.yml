services:
  caddy:
    container_name: caddy
    image: lucaslorentz/caddy-docker-proxy:2.10.0-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/caddy:/data
    networks:
      - frontend-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2019/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  seatable-mcp:
    container_name: seatable-mcp
    image: seatable/seatable-mcp:latest
    labels:
      caddy: ${SEATABLE_MCP_HOSTNAME}
      caddy.reverse_proxy: "{{upstreams 3000}}"
      # Replace X-Forwarded-For instead of appending to it. Caddy appends by
      # default, which leaves a client-supplied value in front of the real peer
      # — and that value is what rate limiting would be keyed on. Overwriting
      # here means the header carries exactly one hop: the actual client.
      caddy.reverse_proxy.header_up: "X-Forwarded-For {remote_host}"
    environment:
      - SEATABLE_SERVER_URL
      - SEATABLE_API_TOKEN
      - SEATABLE_BASES
      - SEATABLE_MODE=managed
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - frontend-net
    restart: unless-stopped

networks:
  frontend-net:
