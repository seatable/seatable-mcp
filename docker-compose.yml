services:
  caddy:
    container_name: caddy
    image: lucaslorentz/caddy-docker-proxy:2.13.1-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/caddy:/data
    networks:
      - frontend-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2019/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  seatable-mcp:
    container_name: seatable-mcp
    image: seatable/seatable-mcp:latest
    labels:
      caddy: ${SEATABLE_MCP_HOSTNAME}
      caddy.reverse_proxy: "{{upstreams 3000}}"
      # Replace X-Forwarded-For instead of appending to it. Caddy appends by
      # default, which leaves a client-supplied value in front of the real peer
      # — and that value is what rate limiting would be keyed on. Overwriting
      # here means the header carries exactly one hop: the actual client.
      caddy.reverse_proxy.header_up: "X-Forwarded-For {remote_host}"
    environment:
      - SEATABLE_SERVER_URL
      - SEATABLE_API_TOKEN
      - SEATABLE_BASES
      - SEATABLE_MODE=managed
      # Required in managed mode: seals the OAuth tokens the server issues.
      # Generate once (openssl rand -hex 32) and keep it stable; changing it
      # signs every client out.
      - SEATABLE_TOKEN_SECRET
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    # The server writes no files and needs no privileges. Together with the
    # Node permission model in the image's CMD, code running in the process
    # can neither change the filesystem nor gain capabilities.
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    networks:
      - frontend-net
    restart: unless-stopped

networks:
  frontend-net:
